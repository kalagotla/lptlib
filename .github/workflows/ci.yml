name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    env:
      MPLBACKEND: Agg  # headless matplotlib; test/conftest.py also forces it

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install system MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mpi]"

      # The coverage floor is deliberately conservative. Current coverage is
      # around 44 percent, and much of the uncovered code is the MPI and
      # large-dataset paths that cannot run in CI. The gate exists to catch a
      # regression that guts the suite, not to certify a coverage target; raise
      # it as data-independent tests are added.
      - name: Run test suite with coverage
        run: >-
          pytest test -v
          --cov=lptlib
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=40

  import-without-mpi:
    name: Import without the mpi extra
    runs-on: ubuntu-latest
    # mpi4py is an optional dependency. A stray top-level 'from mpi4py import MPI'
    # makes 'import lptlib' fail for every user without a system MPI runtime,
    # which is exactly the regression this project has shipped before. No MPI is
    # installed in this job, so the import below fails loudly if it comes back.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package without optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Assert mpi4py is absent and the package still imports
        run: |
          python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('mpi4py') is None, 'mpi4py leaked into the base install'
          import lptlib
          from lptlib import GridIO, FlowIO, Streamlines, StochasticModel, DataIO, ObliqueShock
          print('lptlib', lptlib.__version__, 'imports without mpi4py')
          "

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: `ruff check src test` currently reports about 160
    # findings (198 across the whole repository), so a blocking gate would fail
    # every pull request on day one. The step runs so the count is visible and
    # can be driven down; remove continue-on-error once the backlog is cleared.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check src test
