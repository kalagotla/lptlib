name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    env:
      MPLBACKEND: Agg  # headless matplotlib; test/conftest.py also forces it

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system MPI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install system MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mpi]"

      # The coverage floor is deliberately conservative. Measured coverage is
      # 68 percent, and much of the uncovered code is the MPI and large-dataset
      # paths that cannot run in CI. The floor is set at 60 so there is real
      # headroom: it catches a regression that guts the suite without failing a
      # pull request that legitimately moves a few points. Raise it as
      # data-independent tests are added.
      #
      # The tests that launch MPI processes are opt-in and stay skipped here:
      # nothing sets LPTLIB_RUN_MPI, so a two-rank run never happens in this
      # job. mpi4py is still installed above so that the DataIO reduction test,
      # which drives the single-rank MPI path in-process, runs rather than
      # failing on the import. Enabling the launcher tests on a GitHub-hosted
      # runner needs no extra setup, because those runners execute as the
      # unprivileged `runner` user; only a root environment such as a container
      # needs OMPI_ALLOW_RUN_AS_ROOT=1 and OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1,
      # which Open MPI otherwise refuses.
      - name: Run test suite with coverage
        run: >-
          pytest test -v
          --cov=lptlib
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

  import-without-mpi:
    name: Import without the mpi extra
    runs-on: ubuntu-latest
    # mpi4py is an optional dependency. A stray top-level 'from mpi4py import MPI'
    # makes 'import lptlib' fail for every user without a system MPI runtime,
    # which is exactly the regression this project has shipped before. No MPI is
    # installed in this job, so the import below fails loudly if it comes back.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package without optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Assert mpi4py is absent and the package still imports
        run: |
          python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('mpi4py') is None, 'mpi4py leaked into the base install'
          import lptlib
          from lptlib import GridIO, FlowIO, Streamlines, StochasticModel, DataIO, ObliqueShock
          print('lptlib', lptlib.__version__, 'imports without mpi4py')
          "

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Blocking. The backlog this job was once advisory for is cleared:
    # `ruff check src test` reports zero findings under the rule set pinned in
    # pyproject.toml (`[tool.ruff.lint] select = ["E4", "E7", "E9", "F"]`).
    # Pinning matters as much as clearing: Ruff's default selection widens
    # between releases, so an unpinned project starts failing this gate on
    # rules it never opted into.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check src test
