name: Publish to PyPI

# ---------------------------------------------------------------------------
# ACTION REQUIRED BEFORE THE NEXT RELEASE
#
# This workflow publishes with PyPI Trusted Publishing (OIDC) instead of a
# long-lived API token. Trusted Publishing must be configured on PyPI first:
#
#   https://pypi.org/manage/project/lptlib/settings/publishing/
#     owner:      kalagotla
#     repository: lptlib
#     workflow:   publish.yml
#     environment: pypi
#
# Until that publisher exists, the "Publish to PyPI" step below WILL FAIL with
# an OIDC / invalid-publisher error. Nothing else is affected: the build and the
# tests still run, and no partial upload can happen.
#
# To fall back to the previous token-based upload, delete the `permissions` and
# `environment` blocks and replace the final step with:
#
#     - name: Publish to PyPI
#       env:
#         TWINE_USERNAME: __token__
#         TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
#       run: twine upload dist/*
#
# Keep the PYPI_API_TOKEN secret in place until the first Trusted Publishing
# release has succeeded.
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch:  # Allows manual triggering

jobs:
  # Never publish an artifact whose tests were not run. This reuses the same
  # suite as CI rather than trusting that CI happened to pass on the tag.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Install system MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mpi]"

      - name: Run test suite
        run: pytest test -v

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
