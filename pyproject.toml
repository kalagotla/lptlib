[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lptlib"
version = "0.2.0"
authors = [
    {name="Dilip Kalagotla", email="dilipkalagotla@gmail.com"},
    ]
description = "One-way coupled Lagrangian Particle Tracking algorithms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
# Test and coverage tooling. Install with:
#     pip install -e ".[test]"
test = [
    "pytest",
    "parameterized",
    "pytest-cov",
]

# MPI-parallel execution backends (StochasticModel.mpi_run and the DataIO
# Lagrangian-to-Eulerian reduction). mpi4py needs a system MPI runtime, so it is
# optional; the rest of the library imports and runs without it. Install with:
#     pip install "lptlib[mpi]"
mpi = [
    "mpi4py",
]

# Extra packages used by the scripts in the repository root (main.py). Not
# needed by the library itself. Install with:
#     pip install -e ".[examples]"
examples = [
    "seaborn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    ".git",
    "data",
    "build",
    ".tox",
    ".eggs",
]

# Pin the rule set instead of inheriting Ruff's default selection. The default
# widens between Ruff releases, so an unpinned project starts failing its own
# lint gate when a new Ruff version ships rules it never opted into. These four
# are the pycodestyle error groups that catch real breakage (E4 imports,
# E7 statements, E9 syntax and IO errors) plus Pyflakes (F), which finds
# undefined names, unused imports, and unused variables.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["lptlib"]
branch = false

[tool.coverage.report]
show_missing = true

[project.urls]
homepage = "https://github.com/kalagotla/lptlib"
issues = "https://github.com/kalagotla/lptlib/issues"

[tool.uv]
link-mode = "copy"
